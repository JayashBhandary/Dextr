name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.0'
  FLUTTER_CHANNEL: 'stable'

jobs:
  build-macos:
    name: Build macOS (arm64 + x64 + universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Resolve version
        id: ver
        run: |
          # Single source of truth: the `version:` line in pubspec.yaml.
          # Strip the +build suffix -> 0.1.0+1 becomes 0.1.0.
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+]+).*/\1/' | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build macOS app (universal)
        run: flutter build macos --release

      - name: Verify universal binary
        run: |
          BIN="build/macos/Build/Products/Release/Dextr.app/Contents/MacOS/Dextr"
          file "$BIN"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -E 'arm64' && lipo -info "$BIN" | grep -E 'x86_64'

      - name: Package DMGs (universal, arm64, x64)
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          SRC="build/macos/Build/Products/Release/Dextr.app"
          ENTITLEMENTS="$PWD/macos/Runner/Release.entitlements"

          thin_app() {
            local app="$1"
            local arch="$2"
            find "$app" -type f -print0 | while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q "Mach-O.*universal"; then
                lipo "$f" -thin "$arch" -output "$f.tmp" && mv "$f.tmp" "$f"
              fi
            done
            # Re-sign ad-hoc since lipo invalidated signatures. Inside-out rather
            # than --deep, and the entitlements are named explicitly: a re-sign
            # without --entitlements drops every entitlement Xcode applied, and
            # an app with no com.apple.security.files.user-selected.read-write
            # cannot open a save dialog — file_picker checks the signature at
            # runtime and refuses with ENTITLEMENT_REQUIRED_WRITE. --deep would
            # push the app's sandbox entitlements onto the frameworks too.
            find "$app/Contents/Frameworks" -mindepth 1 -maxdepth 1 -print0 \
              | while IFS= read -r -d '' framework; do
                  codesign --force --sign - "$framework"
                done
            codesign --force --sign - --entitlements "$ENTITLEMENTS" "$app"
          }

          # The entitlements are what let the app open a file dialog at all, so
          # a build that lost them must fail here rather than ship.
          verify_entitlements() {
            local app="$1"
            codesign --verify --strict "$app"
            codesign -d --entitlements :- "$app" 2>/dev/null \
              | grep -q 'com.apple.security.files.user-selected.read-write' \
              || { echo "::error::$app is missing the read-write entitlement" >&2; exit 1; }
          }

          package_dmg() {
            local flavor="$1"
            local arch="$2"   # empty = universal, no thinning
            local stage="dist/$flavor"
            local app_copy="$stage/Dextr.app"
            rm -rf "$stage"
            mkdir -p "$stage"
            cp -R "$SRC" "$app_copy"
            ln -s /Applications "$stage/Applications"

            if [ -n "$arch" ]; then
              echo "==> Thinning $flavor to $arch"
              thin_app "$app_copy" "$arch"
              echo "==> Verifying thinned main binary"
              lipo -info "$app_copy/Contents/MacOS/Dextr"
            fi

            verify_entitlements "$app_copy"

            hdiutil create \
              -volname "Dextr" \
              -srcfolder "$stage" \
              -ov -format UDZO \
              "dextr-${VERSION}-macos-${flavor}.dmg"
          }

          package_dmg "universal" ""
          package_dmg "arm64"     "arm64"
          package_dmg "x64"       "x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dextr-*-macos-*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+]+).*/\1/' | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Package zip
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $dest = "dextr-$version-windows-x64.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $dest

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dextr-*-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev
          # libsecret/libjsoncpp: required by flutter_secure_storage on Linux.

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Resolve version
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+]+).*/\1/' | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release

      - name: Stage desktop entry and icon
        run: |
          BUNDLE="build/linux/x64/release/bundle"
          cp linux/packaging/com.dextr.dextr.desktop "$BUNDLE/com.dextr.dextr.desktop"
          cp assets/icon/icon.png "$BUNDLE/dextr.png"

      - name: Package tarball
        run: |
          tar -czf "dextr-${{ steps.ver.outputs.version }}-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dextr-*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    # Job-scoped, and it replaces the workflow default rather than adding to it,
    # so `contents` is restated here. `id-token` and `attestations` are what the
    # provenance step signs with.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve tag
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+]+).*/\1/' | tr -d '[:space:]')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      # The installers refuse to install anything whose digest is not in here,
      # so this file is what makes `curl | sh` verifiable rather than hopeful.
      # Flattened first: the download step nests each artifact under its job
      # name, and a SHA256SUMS full of `./macos/x.dmg` paths cannot be checked
      # against a file downloaded on its own.
      - name: Collect artifacts and publish checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \
            \( -name 'dextr-*.dmg' -o -name 'dextr-*.zip' -o -name 'dextr-*.tar.gz' \) \
            -exec mv {} dist/ \;
          cd dist
          sha256sum dextr-* > SHA256SUMS
          echo "==> Published digests:"
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/dextr-*'

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: dextr ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/dextr-*
            dist/SHA256SUMS
