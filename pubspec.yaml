name: dextr
description: "Cross-platform database & data-source management tool."
publish_to: 'none'
version: 0.1.3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Routing
  go_router: ^17.5.0

  # Models / codegen runtime
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Logging / utilities
  logger: ^2.4.0
  uuid: ^4.5.1
  collection: ^1.19.0
  path: ^1.9.0

  # Office formats. A .docx and a .xlsx are a zip of XML, so previewing one is
  # an unzip and a parse rather than a rendering engine.
  archive: ^4.0.9
  xml: ^6.6.1
  path_provider: ^2.1.4
  file_picker: ^12.0.0-beta.7

  # Secure credential storage
  flutter_secure_storage: ^11.0.0

  # Desktop window
  window_manager: ^0.5.2

  # SQLite (FFI, desktop/mobile; web needs wasm worker)
  sqlite3: ^3.5.1
  sqlite3_flutter_libs: ^0.6.0+eol

  # Relational drivers
  postgres: ^3.5.0
  mysql_client: ^0.0.27

  # NoSQL
  mongo_dart: ^0.10.4

  # Firestore via REST (multi-project; not cloud_firestore)
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3

  # Object storage (S3 / MinIO / R2 / etc.)
  minio: ^3.5.0

  # HTTP / REST / GraphQL
  dio: ^5.7.0
  http: ^1.2.0
  graphql: ^5.2.0-beta.7

  # UI: the whole widget set, plus the Lucide glyphs astryx_ui itself draws with
  # (its own AstryxIconName registry covers 28 semantic names; a database tool
  # needs tables, buckets and plugs as well).
  astryx_ui: ^0.0.7-dev
  lucide_icons_flutter: ^3.0.0
  flutter_acrylic: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/

# App launcher icons generated from assets/icon/icon.png.
# Regenerate after changing the source: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#000000"
    theme_color: "#000000"
